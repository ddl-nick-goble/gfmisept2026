<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human in the Loop Is Not a New Pattern</title>
<style>
:root{
  /* ---- paper & ink ---- */
  --paper:#FAF8F4;
  --paper-2:#F2EEE6;
  --paper-3:#EBE6DA;
  --ink:#17171B;
  --ink-2:#33333C;
  --muted:#5D5D67;
  --faint:#77736A;
  --rule:#DCD7CA;
  --rule-2:#E9E4D8;

  /* ---- accents ----
     oxblood is the only emphasis colour: the human, the Check, the point.
     ochre / teal / indigo mean first / second / third line of defence and
     appear nowhere else. taupe is "held by the machine". */
  --accent:#8A2F3E;      /* oxblood */
  --accent-soft:#F1E3E4;
  --taupe:#8C8578;       /* agent-owned, deliberately unaccented */
  --taupe-soft:#EDE9DF;
  --agent:#A2691F;       /* first line only */
  --agent-soft:#F4EADA;
  --human:#1E4B5A;       /* second line only */
  --human-soft:#E2ECEE;
  --third:#3B3A6E;       /* third line only */
  --third-soft:#E4E3EF;

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#EDEAE3;font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}

#stage{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none;
  background:var(--paper);box-shadow:0 24px 70px rgba(30,26,18,.16),0 2px 6px rgba(30,26,18,.06)}

.slide{
  position:absolute;inset:0;
  padding:60px 70px 78px;
  display:none;
  flex-direction:column;
  justify-content:center;
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
}
.slide.active{display:flex}
.slide.tight{padding:60px 70px 70px}
.slide.wide{padding:60px 70px 70px}
.fitwrap{display:flex;flex-direction:column;justify-content:center;width:100%;transform-origin:center center}
.slide.center{align-items:center;text-align:center}
.slide.center .fitwrap{align-items:center}

/* dark act-marker slides */
.slide.dark{background:#16161A;color:#F3F1EC}
.slide.dark h1,.slide.dark h2,.slide.dark .big,.slide.dark .huge,.slide.dark strong{color:#F7F5F0}
.slide.dark p,.slide.dark li{color:#B3B0A8}
.slide.dark .kicker{color:#84817A}
.slide.dark h3{color:#D89AA4}
.slide.dark .rule{background:#3A3A40}

/* ---------- typography ---------- */
h1{font-family:var(--serif);font-size:66px;line-height:1.06;font-weight:600;letter-spacing:-.022em;color:var(--ink);text-wrap:balance}
h2{font-family:var(--serif);font-size:44px;line-height:1.14;font-weight:600;letter-spacing:-.016em;margin-bottom:26px;color:var(--ink);text-wrap:balance}
h3{font-size:15px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
p{font-size:25px;line-height:1.5;color:var(--muted);max-width:56ch;text-wrap:pretty}
p+p{margin-top:18px}
strong{color:var(--ink);font-weight:650}
em{font-style:italic;color:var(--ink-2)}
.big{font-family:var(--serif);font-size:52px;line-height:1.16;color:var(--ink);font-weight:600;letter-spacing:-.02em;max-width:24ch;text-wrap:balance}
.huge{font-family:var(--serif);font-size:76px;line-height:1.08;color:var(--ink);font-weight:600;letter-spacing:-.028em;max-width:17ch;text-wrap:balance}
.kicker{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:18px;font-weight:700}
.sub{font-size:22px;color:var(--faint);line-height:1.5;margin-top:22px;max-width:60ch;text-wrap:pretty}
.lede{font-size:28px;line-height:1.45;color:var(--ink-2);max-width:44ch;text-wrap:balance}
.accent{color:var(--accent)}
.agentc{color:var(--agent)}
.humanc{color:var(--human)}
.strike{color:var(--faint);background-image:linear-gradient(to bottom,transparent 0,transparent calc(50% - 1px),var(--accent) calc(50% - 1px),var(--accent) calc(50% + 1px),transparent calc(50% + 1px));background-repeat:no-repeat}

.rule{height:1px;background:var(--rule);width:100%;margin:26px 0}
.rule.short{width:74px;height:2px;background:var(--accent);margin:0 0 24px}
.slide.center .rule.short{margin-left:auto;margin-right:auto}

/* ---------- layout helpers ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center;width:100%}
.cols.top{align-items:start}
.cols.a{grid-template-columns:1.05fr .95fr}
.cols.b{grid-template-columns:.86fr 1.14fr}
.cols.c{grid-template-columns:1.25fr .75fr}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch;width:100%}
.row{display:flex;align-items:center;gap:40px;width:100%;justify-content:center}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:18px}
.mt{margin-top:26px}.mt2{margin-top:40px}.mb{margin-bottom:22px}

/* ---------- cards / panels ---------- */
.card{background:var(--paper-2);border:1px solid var(--rule-2);border-radius:2px;padding:30px}
.card h4{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:700}
.card p{font-size:19px;line-height:1.46;color:var(--muted);max-width:none}
.card .n{font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;color:var(--faint);display:block;margin-bottom:14px;font-weight:600}
.card.lift{background:var(--paper);border-color:var(--rule)}

/* left-ruled callout, matches the hairline language */
.callout{border-left:2px solid var(--accent);padding:2px 0 2px 24px}
.callout .n{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;color:var(--accent);display:block;margin-bottom:12px;font-weight:700}
.callout p{font-size:22px;line-height:1.45;color:var(--ink-2);max-width:32ch}

.line-card{border-top:3px solid var(--rule);padding:22px 0 0;display:flex;flex-direction:column}
.line-card.l1{border-top-color:var(--agent)}
.line-card.l2{border-top-color:var(--human)}
.line-card.l3{border-top-color:var(--third)}
.line-card .ord{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--faint);font-weight:700;margin-bottom:12px}
.line-card .name{font-family:var(--sans);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}
.line-card .paren{font-size:19px;color:var(--muted);line-height:1.4}
.line-card .who{font-size:17px;color:var(--muted);line-height:1.45;margin-top:auto;padding-top:16px;border-top:1px solid var(--rule-2)}

/* lists */
ul{list-style:none}
li{font-size:24px;line-height:1.45;color:var(--muted);padding-left:32px;position:relative;margin-bottom:16px;max-width:56ch}
li:last-child{margin-bottom:0}
li:before{content:"";position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.dash:before{content:"";width:15px;height:2px;border-radius:0;top:16px;left:0;background:var(--faint)}
li strong{color:var(--ink)}
ul.q li{font-family:var(--serif);font-size:34px;line-height:1.28;color:var(--ink);margin-bottom:22px;padding-left:0}
ul.q li:before{display:none}
ul.q li .ans{display:block;font-family:var(--sans);font-size:21px;line-height:1.45;color:var(--muted);margin-top:12px}

/* quote */
.quote{font-family:var(--serif);font-size:29px;line-height:1.42;color:var(--ink);font-style:italic;border-left:2px solid var(--accent);padding-left:28px;max-width:44ch}
.attr{font-size:15px;color:var(--faint);margin-top:18px;padding-left:30px;letter-spacing:.05em;font-style:normal;line-height:1.5;max-width:66ch}

/* stat */
.stat{font-family:var(--serif);font-size:74px;line-height:1;font-weight:600;letter-spacing:-.032em;color:var(--ink)}
.stat-label{font-size:17px;color:var(--faint);margin-top:10px;line-height:1.4}

/* footnote */
.fn{position:absolute;left:70px;right:70px;bottom:30px;font-size:13px;line-height:1.55;color:var(--faint);font-family:var(--sans);
    border-top:1px solid var(--rule-2);padding-top:14px;text-wrap:pretty}
.fn b{color:var(--muted);font-weight:600}

/* chips */
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:2px;font-family:var(--sans)}
.chip.human{background:var(--accent-soft);color:var(--accent)}
.chip.agent{background:#E8E5DD;color:#5D5D67}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.flat{background:var(--paper-3);color:var(--muted)}
.chiprow{display:flex;gap:10px}

/* operator pipeline (input -> model -> output) */
.pipe{display:flex;align-items:center;gap:22px;font-family:var(--sans)}
.pipe .term{font-size:22px;color:var(--muted);letter-spacing:.02em}
.pipe .arw{width:52px;height:2px;background:#A8A192;position:relative;flex:none}
.pipe .arw:after{content:"";position:absolute;right:-1px;top:-4px;border-left:9px solid #A8A192;border-top:5px solid transparent;border-bottom:5px solid transparent}
.pipe .box{border:2px solid var(--ink);border-radius:3px;padding:20px 34px;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);background:var(--paper)}
.pipe .box.op{border-color:var(--accent);color:var(--accent)}

/* cycle svg */
.cyc{display:block;overflow:visible}
.cyc text{font-family:var(--sans);font-weight:650;fill:var(--ink)}
.cyc .lab{font-size:22px}
.cyc .cen{font-size:13px;letter-spacing:.17em;font-weight:700;fill:var(--faint)}
.cyc .cen-b{font-family:var(--serif);font-size:26px;font-weight:600;fill:var(--ink);letter-spacing:0}
.cyc .cap{font-size:13px;letter-spacing:.14em;font-weight:700;fill:var(--faint)}

/* diagram + caption rows share a common baseline: the art box is a fixed
   height with the ring centred in it, the caption is its own row */
.cycwrap{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;row-gap:14px}
.cycwrap .art{display:flex;align-items:center;justify-content:center;width:100%}
.cycwrap .cap-t{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700;text-align:center;text-wrap:balance}
.cycwrap .cap-b{font-size:17px;color:var(--muted);text-align:center;line-height:1.4;max-width:20ch;min-height:2.5em;text-wrap:balance;align-self:start}
.eq{font-family:var(--serif);font-size:50px;color:#8C8577;line-height:1;align-self:center}
.conn{font-size:40px;color:#8C8577;line-height:1;align-self:center}

/* definition column */
.defs{display:grid;row-gap:17px}
.defs .dt{font-size:13px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:var(--ink);margin-bottom:5px}
.defs .dd{font-size:19.5px;line-height:1.42;color:var(--muted);max-width:34ch}

/* one-to-one mapping strip */
.map{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);margin-top:30px}
.map>div{padding:16px 6px 2px;text-align:center;border-right:1px solid var(--rule-2);white-space:nowrap}
.map>div:last-child{border-right:none}
.map .a{font-size:19px;color:var(--ink);font-weight:650}
.map .arr{color:var(--faint);margin:0 9px;font-size:16px}
.map .b{font-size:19px;color:var(--ink);font-weight:650}

/* nested assurance shells */
.shells{position:relative;display:inline-flex;align-items:center;justify-content:center}
.shell{border:1.5px solid var(--rule);border-radius:3px;padding:24px 28px 28px;position:relative;background:transparent}
.shell>.tagt{position:absolute;top:-10px;left:24px;background:var(--paper);padding:0 11px;font-size:13px;letter-spacing:.17em;text-transform:uppercase;font-weight:700}
.shell.s1{border-color:var(--agent)}.shell.s1>.tagt{color:var(--agent)}
.shell.s2{border-color:var(--human)}.shell.s2>.tagt{color:var(--human)}
.shell.s3{border-color:var(--third)}.shell.s3>.tagt{color:var(--third)}

/* jack plate */
.plate-wrap{position:relative;width:100%}
.plate{width:100%;display:block}
.legend{display:grid;grid-template-columns:26px 1fr;row-gap:14px;column-gap:12px;font-size:18px;line-height:1.38}
.legend .k{font-family:var(--mono);font-size:17px;color:var(--accent);font-weight:700}
.legend .v{color:var(--muted)}
.legend .v strong{color:var(--ink)}
.legend.lines{grid-template-columns:max-content 1fr;column-gap:24px;row-gap:22px}
.legend.lines .k{font-size:12px;letter-spacing:.12em;line-height:1.5;white-space:nowrap;padding-top:3px}

/* demo cue */
/* The video gets its own area and the caption gets a solid band underneath.
   Full-bleed video with an overlaid caption looked better empty, but a real
   screen recording is bright, and the native control bar lands exactly where
   the caption's last line sits. */
.slide.demo{background:#14141A;color:#F2F0EB;padding:0;align-items:stretch;justify-content:flex-start}
.slide.demo .vidbox{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0B0B0F;overflow:hidden}
.slide.demo video{width:100%;height:100%;object-fit:contain;background:#0B0B0F}
.slide.demo .ph{position:absolute;inset:26px 70px;border:1px solid rgba(255,255,255,.12);border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#7C7C88;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 12px,transparent 12px 24px)}
.slide.demo .ph .mark{width:66px;height:66px;border:1.5px solid #4A4A56;border-radius:50%;display:flex;align-items:center;justify-content:center}
.slide.demo .ph .mark:after{content:"";border-left:18px solid #7C7C88;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:6px}
.slide.demo .ph .fname{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:#9A9AA6}
.slide.demo .ph .hint{font-size:12.5px;color:#5E5E6A;letter-spacing:.05em}
.slide.demo .caption{position:relative;z-index:3;flex:none;padding:26px 70px 30px;
  background:#101016;border-top:1px solid rgba(255,255,255,.09)}
/* While a demo plays, drop the caption band so the video takes the whole
   slide. A 1080p screen recording letterboxed into 525px renders UI text at
   half size, which the back of the room cannot read; full bleed gets it to
   two thirds. The caption comes back the moment you pause. */
.slide.demo.playing .caption{display:none}
.slide.demo .caption .tagd{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#D89AA4;margin-bottom:14px}
.slide.demo .caption .tagd.l1{color:#D9A45C}
.slide.demo .caption .tagd.l2{color:#79B4C4}
.slide.demo .caption .tagd.l3{color:#9E9CD8}
.slide.demo .caption h2{color:#F7F5F0;font-size:36px;margin-bottom:10px}
.slide.demo .caption p{color:#ADAAA4;font-size:20px;max-width:none;line-height:1.45}

/* ---------- chrome ---------- */
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;transition:width .28s ease;z-index:60}
.chrome{position:fixed;bottom:14px;font-family:var(--mono);font-size:12px;color:#8E8A80;z-index:60;letter-spacing:.07em}
#num{right:20px}
#act{left:20px;font-family:var(--sans);font-size:11px;letter-spacing:.19em;text-transform:uppercase;font-weight:700}
#clock{left:50%;transform:translateX(-50%);font-variant-numeric:tabular-nums;display:none}
#clock.on{display:block}
#clock.over{color:var(--accent);font-weight:700}
#help{position:fixed;top:16px;right:20px;font-family:var(--mono);font-size:11px;color:#A5A199;z-index:60;letter-spacing:.05em;
  opacity:.7;transition:opacity .7s ease;pointer-events:none}
#help.gone{opacity:0}

#notes{position:fixed;inset:auto 0 0 0;height:36vh;background:#141418;border-top:1px solid #2B2B32;padding:22px 30px;overflow-y:auto;display:none;z-index:70}
#notes.on{display:block}
#notes h5{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#D89AA4;margin-bottom:12px;font-weight:700}
#notes .body{font-size:16.5px;line-height:1.62;color:#B8B5AE;white-space:pre-wrap;max-width:120ch}
#notes .body b,#notes .body strong{color:#F2F0EB}

#ovl{position:fixed;inset:0;background:rgba(18,17,15,.97);z-index:90;display:none;overflow-y:auto;padding:34px 34px 60px}
#ovl.on{display:block}
#ovl .oh{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8E8A80;font-weight:700;margin-bottom:20px;font-family:var(--sans)}
#ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.ocard{cursor:pointer;position:relative;border:1px solid #353430;background:var(--paper);overflow:hidden;aspect-ratio:16/9}
.ocard.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(138,47,62,.5)}
.ocard .mini{width:1280px;height:720px;transform-origin:top left;pointer-events:none}
.ocard .mini .slide{display:flex!important;position:absolute}
.ocard .on{position:absolute;bottom:0;left:0;background:rgba(18,17,15,.86);color:#EDEAE3;font-family:var(--mono);font-size:11px;padding:3px 7px;letter-spacing:.06em}
.ocard:hover{border-color:#7A7770}

.frag{opacity:0;transition:opacity .3s ease,transform .3s ease;transform:translateY(6px)}
.frag.show{opacity:1;transform:none}
.frag.nofade{transition:opacity .2s ease}

@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{overflow:visible!important;height:auto!important;background:#fff;display:block;padding:0!important}
  #stage{width:1280px;height:auto;transform:none!important;box-shadow:none;margin:0!important}
  .slide{display:flex!important;position:relative;width:1280px;height:720px;overflow:hidden;
    page-break-after:always;break-after:page}
  .slide:last-child{page-break-after:auto;break-after:auto}
  .fitwrap{transform:none!important}
  .frag{opacity:1!important;transform:none!important}
  #bar,.chrome,#help,#notes,#ovl{display:none!important}
  video{display:none!important}
  .slide.demo .ph{display:flex!important}
  .slide.demo .ph .hint{display:none}   /* build note, not handout content */
  .slide.demo.playing .caption{display:flex!important}
  @page{size:1280px 720px;margin:0}
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="bar"></div>
<div class="chrome" id="num"></div>
<div class="chrome" id="act"></div>
<div class="chrome" id="clock"></div>
<div id="help">&larr; &rarr; move &middot; S notes &middot; T timer &middot; O overview &middot; F full</div>
<div id="notes"><h5>Speaker notes</h5><div class="body"></div></div>
<div id="ovl"><div class="oh">Overview &middot; click to jump &middot; O to close</div><div id="ovg"></div></div>

<script>
/* ============================================================
   DIAGRAM LIBRARY
   ============================================================ */
const RAD = Math.PI/180;
const fx = n => Math.round(n*100)/100;
const P = (cx,cy,r,d) => [cx + r*Math.cos(d*RAD), cy + r*Math.sin(d*RAD)];

function arcD(cx,cy,r,a0,a1){
  const [x0,y0]=P(cx,cy,r,a0), [x1,y1]=P(cx,cy,r,a1);
  const span=((a1-a0)%360+360)%360;
  return `M${fx(x0)} ${fx(y0)}A${r} ${r} 0 ${span>180?1:0} 1 ${fx(x1)} ${fx(y1)}`;
}
function headD(cx,cy,r,a,s,col,op){
  const [x,y]=P(cx,cy,r,a);
  return `<path d="M${-s} ${-s*0.66}L${fx(s*0.62)} 0L${-s} ${fx(s*0.66)}Z" fill="${col}" opacity="${op}" `
       + `transform="translate(${fx(x)} ${fx(y)}) rotate(${fx(a+92)})"/>`;
}

/* One reusable cycle ring.
   labels : array of strings, first sits at the top, order is clockwise
   tones  : array of css colours, one per label (colours the label AND the arc leaving it)
   hi     : indices to thicken       dim : indices to fade
   center : small caps centre label  centerBig : serif centre label            */
function cycle(o){
  const c = Object.assign({
    r:112, labels:['Plan','Do','Check','Act'], gap:30, sw:2.1, ls:22,
    tones:null, labelTones:null, dim:[], center:null, centerBig:null,
    padX:112, padY:58, arrow:8.5, dash:null, base:'#99917F', labelColor:null,
    focus:null,          /* index of the node that is the point of the slide */
    dimOthers:false,     /* fade the whole ring so the focus node carries it */
    dot:6.5, cls:''
  }, o);
  const n=c.labels.length, step=360/n;
  const W=2*(c.r+c.padX), H=2*(c.r+c.padY), cx=W/2, cy=H/2;
  const FADE=0.55;
  let s='';

  /* arcs: identical geometry for every segment, so the four gaps stay even */
  for(let i=0;i<n;i++){
    const a0=-90+i*step+c.gap/2, a1=-90+(i+1)*step-c.gap/2;
    const col=(c.tones&&c.tones[i])||c.base;
    const op = c.dimOthers ? FADE : (c.dim.includes(i) ? FADE : 1);
    s+=`<path d="${arcD(cx,cy,c.r,a0,a1)}" fill="none" stroke="${col}" stroke-width="${c.sw}"`
     + ` stroke-linecap="round" opacity="${op}"${c.dash?` stroke-dasharray="${c.dash}"`:''}/>`;
    s+=headD(cx,cy,c.r,a1,c.arrow,col,op);
  }

  /* focus marker sits ON the node, so emphasis never terminates elsewhere */
  if(c.focus!=null){
    const a=-90+c.focus*step, [dx,dy2]=P(cx,cy,c.r,a);
    s+=`<circle cx="${fx(dx)}" cy="${fx(dy2)}" r="${fx(c.dot+5.5)}" fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".34"/>`;
    s+=`<circle cx="${fx(dx)}" cy="${fx(dy2)}" r="${c.dot}" fill="var(--accent)"/>`;
  }

  for(let i=0;i<n;i++){
    if(!c.labels[i]) continue;
    const a=-90+i*step, ca=Math.cos(a*RAD), sa=Math.sin(a*RAD);
    const side=Math.abs(ca)>0.35;
    const isF = (c.focus===i);
    const [lx,ly]=P(cx,cy,c.r+(isF?(side?36:30):(side?24:19)),a);
    const anchor = ca>0.35?'start':(ca<-0.35?'end':'middle');
    const dy = sa<-0.35?'-0.18em' : (sa>0.35?'0.86em':'0.34em');
    const col = isF ? 'var(--accent)' : ((c.labelTones&&c.labelTones[i])||(c.tones&&c.tones[i])||c.labelColor||'var(--ink)');
    const op = isF ? 1 : (c.dimOthers ? 0.52 : (c.dim.includes(i) ? 0.45 : 1));
    s+=`<text class="lab" x="${fx(lx)}" y="${fx(ly)}" dy="${dy}" text-anchor="${anchor}"`
     + ` fill="${col}" opacity="${op}" style="font-size:${c.ls}px;font-weight:${isF?800:650}">`
     + `${c.labels[i]}</text>`;
  }
  if(c.centerBig) s+=`<text class="cen-b" x="${cx}" y="${cy}" dy="0.34em" text-anchor="middle">${c.centerBig}</text>`;
  else if(c.center) s+=`<text class="cen" x="${cx}" y="${cy}" dy="0.34em" text-anchor="middle">${c.center}</text>`;
  return `<svg class="cyc ${c.cls}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
}

/* a plain ring with one arrowhead, for the very first "loop" slide */
function loopMark(o){
  const c=Object.assign({r:76,sw:2.6,col:'#99917F',center:'LOOP',pad:38},o);
  const W=2*(c.r+c.pad),H=2*(c.r+c.pad),cx=W/2,cy=H/2;
  let s=`<path d="${arcD(cx,cy,c.r,-74,-100)}" fill="none" stroke="${c.col}" stroke-width="${c.sw}" stroke-linecap="round"/>`;
  s+=headD(cx,cy,c.r,-101,10.5,c.col,1);
  if(c.center) s+=`<text class="cen" x="${cx}" y="${cy}" dy="0.34em" text-anchor="middle" style="font-size:13px">${c.center}</text>`;
  return `<svg class="cyc" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;
}

/* deterministic angry scribble */
function scribble(w,h,seed,pts,col){
  let s=seed>>>0;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  let x=w/2,y=h/2,d=`M${fx(x)} ${fx(y)}`;
  for(let i=0;i<pts;i++){
    const nx=18+rnd()*(w-36), ny=18+rnd()*(h-36);
    const c1x=x+(rnd()-0.5)*w*0.95, c1y=y+(rnd()-0.5)*h*0.95;
    const c2x=nx+(rnd()-0.5)*w*0.95, c2y=ny+(rnd()-0.5)*h*0.95;
    d+=`C${fx(c1x)} ${fx(c1y)} ${fx(c2x)} ${fx(c2y)} ${fx(nx)} ${fx(ny)}`;
    x=nx;y=ny;
  }
  return `<svg class="cyc" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`
       + `<path d="${d}" fill="none" stroke="${col||'#B6B0A2'}" stroke-width="1.7" stroke-linecap="round" opacity=".85"/></svg>`;
}

/* ==================== II · THE LOOP ==================== */

{act:"II · The loop", notes:`This is the slide that dissolves a distinction this room's controls are built on.

Model risk management assumes development and use are separate phases with a gate between them. Build the model, validate the model, approve the model, then use the model. The gate is the control.

That assumption is breaking. We have used models to build models for years, feature selection, hyperparameter search, synthetic data. Fine. But with agents the thing you use in production is the same thing you develop with, in the same session, in the same turn.

Land it: "With agents, the development loop is the usage loop." There is no gate between them anymore because there is no between.`,
html:`<div class="slide">
  <h2 style="margin-bottom:36px">Building and using have merged.</h2>
  <div class="cols top" style="grid-template-columns:1fr 1fr;gap:60px">
    <div>
      <p style="font-family:var(--serif);font-size:33px;line-height:1.26;color:var(--ink);font-weight:600;max-width:19ch;margin-top:-4px">We use models to build models.</p>
      <p class="frag" style="font-family:var(--serif);font-size:33px;line-height:1.26;color:var(--ink);font-weight:600;max-width:19ch;margin-top:20px">We use agents to build agents.</p>
    </div>
    <div class="callout frag" style="margin-top:-2px">
      <p style="max-width:31ch;font-size:21px">Which used to be two phases with a gate in between. Your controls still assume it is. With agents, the development loop is the usage loop, so there is no between for a gate to sit in.</p>
    </div>
  </div>
</div>`},

{act:"II · The loop", notes:`Say it flat, no irony. Vibe coding is the scariest example in the room because it is the one that is already happening inside your bank whether or not anybody has written a policy about it.

Then actually take the show of hands. Count it. Say the number out loud. If it's a lot: "So we're all doing it." If it's a few: "So a few of us are doing it, and everybody else's engineers are."

Karpathy coined the term on 2 Feb 2025. Worth knowing that in the original post he scoped it to "throwaway weekend projects." That scope did not hold.`,

</div>`},

{act:"II · The loop", notes:`Two states on one slide.

Advance. Second state: there is a process. It's a loop. Prompt, plan, execute, check.

The line to deliver: "It isn't chaos. It's a loop running fast enough that you can't see the individual turns." That reframe is the hinge of the whole talk. Everything after this is about that loop.`,

2. The check is currently done by the same person who wrote the prompt.

Pause here. The room needs a second to notice how ordinary it looks, because the next four slides are about how old it is.`,

{act:"II · The loop", notes:`The scale argument. This is the one slide in the act that is about the future rather than the present.

"Two years ago a turn got you a function. Today a turn gets you a feature, a few files and a test. The direction is not subtle."

Then the governance consequence, which is the point: the number of turns is not going up, the size of each turn is. So an unreviewed turn carries more every quarter. A control that samples turns at a fixed rate is getting weaker on its own, without anybody changing it.

That is the argument for putting the check somewhere structural rather than sampling.`,
html:`<div class="slide wide center">
  <h2 style="margin-bottom:16px">And each turn keeps getting bigger.</h2>
  <div class="cols3" style="gap:44px;align-items:stretch">

    </div>
    <div class="cycwrap">
      <div class="cap-t">Today</div>

    </div>

      <div class="cap-t">Next year</div>

      <div class="cap-b">A service.<br>Spec through to deploy.</div>
    </div>
  </div>
  <p class="frag" style="font-size:22px;margin-top:24px;max-width:66ch;text-align:center">Each turn covers more ground than it used to, so an unreviewed turn carries more than it used to. A control that reviews a fixed share of turns gets weaker every quarter without anybody touching it.</p>
</div>`},

/* ==================== III · THE LOOP ISN'T NEW ==================== */

{act:"III · The loop isn't new", notes:`Slow down here. This is the turn in the talk.

"Everything I have just shown you, the room has seen before. It has a name, it has a literature, and it predates every model any of us has ever validated."

Two names, both of which this room already knows: iterative design, and continual improvement. Say them and let people place themselves.

The reason this matters practically: if the loop is not new, then you do not need a new control framework for it. You need to find where your existing framework already answers the question.

CHECKPOINT: you should be here around minute 8.`,
html:`<div class="slide">
  <h1 style="font-size:70px;max-width:16ch">The loop isn't new.</h1>
  <div class="rule" style="margin:34px 0 30px;width:180px"></div>
  <p style="font-family:var(--serif);font-size:34px;line-height:1.24;color:var(--ink-2);max-width:26ch;font-weight:600">This is iterative design.</p>
  <p class="frag" style="font-family:var(--serif);font-size:34px;line-height:1.24;color:var(--ink-2);max-width:26ch;font-weight:600;margin-top:16px">This is a continual improvement process.</p>
  <p class="frag" style="font-size:21px;margin-top:34px;max-width:34ch">Both have a control literature that predates every model you own.</p>
</div>`},

{act:"III · The loop isn't new", notes:`Say the name before you show the wheel. Half the room will finish the sentence for you.

"Plan, do, check, act. PDCA. This is MBA curriculum. It's on the wall of every manufacturing plant in the country."

Walk the four definitions, but fast, because the room knows them. The one to slow on is Check, because Check is where the whole talk lands. "Check is not 'look at the output.' Check is 'compare what happened to what you said would happen.' Those are different activities and only one of them is a control."

Provenance, if anyone asks or if you want the credibility: the cycle is Shewhart, 1939, in a book Deming edited. Deming took a modified version to Tokyo in 1950 and Japanese practitioners recast it as PDCA in 1951. Deming himself never liked the name, he objected that the English word check means to hold back, and he published his own version as Plan Do Study Act in 1993. Which is a nice irony for this talk, given where we're about to put the human.`,
html:`<div class="slide wide">
  <h3>It already has a name</h3>
  <div class="cols c" style="align-items:center;margin-top:-4px">
    <div style="display:flex;justify-content:center">${cycle({labels:['Plan','Do','Check','Act'],r:112,ls:22,padX:92,padY:50,centerBig:'PDCA',focus:2})}</div>
    <div class="defs">
      <div><div class="dt">Plan</div><div class="dd">Decide what you're going to try, and what you expect to happen.</div></div>
      <div><div class="dt">Do</div><div class="dd">Run it. Small, and on purpose.</div></div>
      <div><div class="dt" style="color:var(--accent)">Check</div><div class="dd">Compare what happened to what you said would happen.</div></div>
      <div><div class="dt">Act</div><div class="dd">Keep it, kill it, or change it. Then go around again.</div></div>
    </div>
  </div>
  <div class="fn">Traces to Walter A. Shewhart, <i>Statistical Method from the Viewpoint of Quality Control</i> (1939), p. 45, a book Deming edited, where the cycle has three steps: specification, production, inspection. Deming took a modified version to a JUSE seminar in Tokyo in 1950 and Japanese practitioners recast it as the four-step Plan&ndash;Do&ndash;Check&ndash;Act in 1951. <b>Deming never accepted that name</b>, objecting that the English &ldquo;check&rdquo; means to hold back, and published his own Plan&ndash;Do&ndash;Study&ndash;Act cycle in <i>The New Economics</i> (1993).</div>
</div>`},

{act:"III · The loop isn't new", notes:`This is the slide that earns the title of the talk. Put the two wheels up and let the room do the mapping before you say it.

"On the left, 1951. On the right, the thing your engineers were doing on their laptops this morning. Do is Execute. Act is Prompt again. That's the whole difference."

Then the consequence, which is what they came for: "If the agent loop is PDCA, then it is not a new control problem. It is a control problem with nearly ninety years of practice behind it, and you already own the framework."

ONE NUMBER ONLY. Shewhart is 1939, so nearly ninety is the defensible figure and it is the strongest one. Do not also say seventy or seventy-five anywhere in the talk.

If a quality person pushes on the mapping: the weakest joint is Act to Prompt again. In PDCA, Act is standardize, abandon or adjust. Concede that Act maps to "keep the code, throw it away, or change the spec" and that the next prompt is really the next Plan. It does not damage the argument.`,
html:`<div class="slide wide center">
  <h2 style="margin-bottom:8px">It's the same loop.</h2>
  <div class="row" style="gap:20px;margin-top:0;align-items:stretch">
    <div class="cycwrap">
      <div></div>
      <div class="art">${cycle({labels:['Plan','Do','Check','Act'],r:84,ls:19,padX:92,padY:42})}</div>
      <div class="cap-t">Quality control, 1951</div>
    </div>
    <div class="cycwrap" style="margin:0 6px"><div></div><div class="art eq">=</div><div class="cap-t"></div></div>
    <div class="cycwrap">
      <div></div>
      <div class="art">${cycle({labels:['Plan','Execute','Check','Prompt'],r:84,ls:19,padX:92,padY:42})}</div>
      <div class="cap-t">Your engineers, this morning</div>
    </div>
  </div>
  <div class="map frag" style="width:100%">
    <div><span class="a">Plan</span><span class="arr">&rarr;</span><span class="b">Plan</span></div>
    <div><span class="a">Do</span><span class="arr">&rarr;</span><span class="b">Execute</span></div>
    <div><span class="a">Check</span><span class="arr">&rarr;</span><span class="b">Check</span></div>
    <div><span class="a">Act</span><span class="arr">&rarr;</span><span class="b">Prompt again</span></div>
  </div>
  <p class="frag" style="font-size:22px;margin-top:22px;max-width:64ch;text-align:center">So this isn't a new control problem. It's a control problem with nearly ninety years of practice behind it, and you already own the framework.</p>
</div>`},

{act:"III · The loop isn't new", notes:`Now the thing that actually changed. Not the loop. Who holds which step.

Left wheel: all four steps human. That was 2022. A person planned, a person wrote the code, a person reviewed it, a person decided what to do about the review.

Advance. Right wheel: the agent has taken Plan and Do.

The line: "The agent took Plan and Do because that's the half that got cheap. Nobody has made Check and Act cheap, because those are the steps somebody has to answer for."

Then the warning, and this is the failure mode this room will actually see: the pressure is to let the agent take Check too, because the agent is fast and the human is the bottleneck. Everything from here is about why that specific move is the one you cannot make.`,
html:`<div class="slide wide center">
  <h2 style="margin-bottom:10px">What changed is who holds which step.</h2>
  <div class="row" style="gap:30px;margin-top:0;align-items:stretch">
    <div class="cycwrap">
      <div></div>
      <div class="art">${cycle({labels:['Plan','Do','Check','Act'],r:82,ls:18,padX:84,padY:40,base:'#B08792',tones:['#B08792','#B08792','#B08792','#B08792'],labelTones:['var(--accent)','var(--accent)','var(--accent)','var(--accent)']})}</div>
      <div class="chiprow"><span class="chip human">All human</span></div>
    </div>
    <div class="cycwrap"><div></div><div class="art conn">&rarr;</div><div class="cap-t"></div></div>
    <div class="cycwrap frag">
      <div></div>
      <div class="art">${cycle({labels:['Plan','Do','Check','Act'],r:82,ls:18,padX:84,padY:40,tones:['#B3AC9C','#B3AC9C','#B08792','#B08792'],labelTones:['#8C8578','#8C8578','var(--accent)','var(--accent)']})}</div>
      <div class="chiprow"><span class="chip human">Human</span><span class="chip agent">Agent</span></div>
    </div>
  </div>
  <p class="frag" style="font-size:22px;margin-top:22px;max-width:64ch;text-align:center">The agent took Plan and Do because that's the half that got cheap. Nobody has made Check&nbsp;and&nbsp;Act cheap, because those are the steps somebody has to answer for.</p>
</div>`},

{act:"III · The loop isn't new", notes:`THE SLIDE. If the room remembers one thing, make it this one. Say the headline, pause, then answer it.

"Accountability has to stay in the loop. Nobody in this room disagrees with that. The question everyone skips is where."

Answer: Check.

Why Check and not Plan: a human who writes the prompt has not overseen anything, they have placed an order. Why Check and not Act: by the time you're acting, the decision has been made, you're just executing it. Check is the only step in the loop whose entire job is comparison.

And the failure mode, stated plainly: if the agent runs the check too, then nothing in the loop can be held accountable, and you no longer have human in the loop. You have a human who was cc'd.

Do not rush off this slide.`,
html:`<div class="slide">
  <h2 style="max-width:32ch">Accountability has to stay in the loop. The question is where.</h2>
  <div class="cols b" style="margin-top:14px">
    <div style="display:flex;justify-content:center">
      ${cycle({labels:['Plan','Do','Check','Act'],r:104,ls:21,padX:92,padY:50,focus:2,dimOthers:true,dot:7.5,gap:40})}
    </div>
    <div>
      <p class="big accent" style="font-size:58px;max-width:10ch">Check.</p>
      <p class="frag" style="font-size:22px;margin-top:22px">It's the only step where somebody has to accept the result. The rest of the loop is doing work. Check is where the work gets accepted.</p>
      <p class="frag" style="font-size:22px;margin-top:16px;color:var(--ink-2)">An agent can do the work of a check. It can't be the thing that answers for the acceptance. So if the agent accepts as well, there's nobody left in the loop to hold accountable.</p>
    </div>
  </div>
</div>`},

{act:"III · The loop isn't new", notes:`Small slide, quick, but it prevents a real objection.

"Somebody is going to say: fine, the human owns Check, but Check just produces a finding. Who fixes it? And the answer is that Act is a loop of its own."

When a check fails, what happens next is a plan, a do, a check and an act. That's your remediation process. It needs the same discipline as the loop it is fixing, and in most organizations it has less.

Optional line if the room is with you: this is also why "we found the issue" is not the same as "we closed the issue," and your audit function already knows the difference.`,
html:`<div class="slide wide center">
  <h2 style="margin-bottom:10px">And Act is a loop of its own.</h2>
  <div class="row" style="gap:34px;margin-top:0;align-items:stretch">
    <div class="cycwrap">
      <div></div>
      <div class="art">${cycle({labels:['Plan','Do','Check','Act'],r:94,ls:20,padX:90,padY:44,focus:3})}</div>
      <div class="cap-t">The outer loop</div>
    </div>
    <div class="cycwrap"><div></div><div class="art conn">&rarr;</div><div class="cap-t"></div></div>
    <div class="cycwrap">
      <div></div>
      <div class="art">${cycle({labels:['Plan','Do','Check','Act'],r:72,ls:17,padX:72,padY:38,base:'#8A2F3E',labelColor:'var(--accent)',sw:1.8,arrow:7.4,gap:34})}</div>
      <div class="cap-t" style="color:var(--accent)">Inside Act</div>
    </div>
  </div>
  <p class="frag" style="font-size:22px;margin-top:22px;max-width:66ch;text-align:center">When a check fails, what happens next is itself a plan, a do, a check and an act. That's your remediation process, and it needs the same discipline as the loop it's fixing.</p>
</div>`},

/* ==================== IV · THE CHECKS ==================== */

{act:"IV · The checks", notes:`Now hand the room something they can put in a policy.

"If the human owns Check, then the next question is what checks. And you already have the answer written down, in three lines."

Walk them. Keep each to one sentence.

FIRST LINE, control. Guardrails. The check that runs whether or not anybody is watching. Owned by the people who build it and run it.

SECOND LINE, validate. Independent testing. Somebody who did not build it forms their own expectation and tests against it. Note the word independent does real work here and you come back to it.

THIRD LINE, audit. Documentation and audit readiness. Evidence that the first two happened, and that they happened before the fact rather than after.

Provenance, and lead with the current one: the IIA Statement of Position, Three Lines Model: Assurance and Advice in Support of Effective Governance, July 2026. That superseded the 2020 Three Lines Model, which itself dropped the "of defense" language from the 2013 position paper. Verify the exact July 2026 publication date on theiia.org before you say a day.

BE HONEST ABOUT THE LABELS. Control, validate, audit are your words, not the IIA's. Say so. And for this room the doctrine actually runs through the OCC Heightened Standards, 12 CFR 30 Appendix D, more than through an IIA paper, so mention the regulator if anybody asks where it is written down.

CHECKPOINT: you should be here around minute 15.`,
html:`<div class="slide wide">
  <h2 style="margin-bottom:36px">So what are the required checks?</h2>
  <div class="cols3">
    <div class="line-card l1">
      <div class="ord">FIRST LINE</div>
      <div class="name">Control</div>
      <div class="paren">Guardrails. The check that runs whether or not anybody is watching.</div>
      <div class="who">Owned by the people who build it and run it.</div>
    </div>
    <div class="line-card l2">
      <div class="ord">SECOND LINE</div>
      <div class="name">Validate</div>
      <div class="paren">Independent testing. Somebody who didn't build it forms their own expectation and tests against it.</div>
      <div class="who">Owned by a function with its own reporting line.</div>
    </div>
    <div class="line-card l3">
      <div class="ord">THIRD LINE</div>
      <div class="name">Audit</div>
      <div class="paren">Documentation and audit readiness. Evidence the first two happened, and that the expectation was recorded before the output existed.</div>
      <div class="who">Owned by internal audit, reporting to the board.</div>
    </div>
  </div>
  <div class="fn">Current form: IIA Statement of Position, <i>Three Lines Model: Assurance and Advice in Support of Effective Governance</i> (July 2026), which supersedes <i>The IIA&rsquo;s Three Lines Model</i> (July 2020) and the original position paper <i>The Three Lines of Defense in Effective Risk Management and Control</i> (January 2013). For US banks the doctrine also runs through the OCC Heightened Standards, 12 CFR 30 Appendix D. <b>Control, validate, audit are my labels, not the IIA&rsquo;s.</b></div>
</div>`},

{act:"IV · The checks", notes:`Give the room credit for the discomfort. Two things genuinely did change, and neither of them is the loop.

One. Model risk management now has to cover models that are indeterministic. Same input, same version, different output, same afternoon. Every backtest you own assumes reproducibility somewhere in its logic.

Two, and this is the harder one. The use case is no longer decided up front. You used to approve a model for a purpose. Now you approve a tool, and the purpose gets chosen at runtime by whoever is holding it.

That second one is the one to sit on. Say it and stop, rather than explaining it. The room will do the work, because everybody in it owns an intake process that asks what the model is for.`,
html:`<div class="slide">
  <h2 style="margin-bottom:34px">So why does all of this feel new?</h2>
  <div class="defs" style="row-gap:30px;max-width:64ch">
    <div>
      <div class="dt" style="color:var(--accent)">One</div>
      <div class="dd" style="font-size:23px;max-width:none">Your inventory now holds <strong style="color:var(--ink)">indeterministic</strong> models. Same input, same version, different output, same afternoon.</div>
    </div>
    <div class="frag">
      <div class="dt" style="color:var(--accent)">Two</div>
      <div class="dd" style="font-size:23px;max-width:none">And the <strong style="color:var(--ink)">use case isn't decided up front</strong> any more. You used to approve a model for a purpose. Now you approve a tool, and the purpose gets picked at runtime by whoever is holding it.</div>
    </div>
  </div>
</div>`},

{act:"IV · The checks", notes:`Read the footnote out loud. Do not editorialize until you have finished reading it.

Then: "That's footnote three. Generative and agentic AI, out of scope, novel and rapidly evolving."

Then the fair reading, because this room will do it anyway and you want to be the one who did it first: the footnote is not a pass. The next sentence hands the problem straight back to your general risk management and governance practices. And the sentence after that pulls non-generative, non-agentic AI fully into scope.

So the position we are all in: the guidance you would reach for tells you to use your own judgement, and the agencies have said an RFI is coming. Which means whatever you build in the next twelve months is the thing you will be examined against later.

Detail worth having: SR 26-2 is interagency, Fed, OCC and FDIC. Signed Randall D. Guynn. Most relevant to organizations over thirty billion in total assets. OCC counterpart is Bulletin 2026-13, which also rescinds the Comptroller's Handbook booklet on model risk management. FDIC counterpart is FIL-15-2026, worth naming if there are FDIC-supervised institutions in the room.

PREPARE FOR THIS ONE. The guidance says on its face that it "does not set forth enforceable standards or prescriptive requirements; accordingly, non-compliance with this guidance will not result in supervisory criticism." Somebody will read that back at you. Your answer: correct, and that is exactly why what you build now matters, because when the RFI lands you will be describing your own practice rather than pointing at a standard.`,
html:`<div class="slide dark">
  <h3 style="color:#D89AA4">The guidance you would reach for</h3>
  <div class="quote" style="border-left-color:#D89AA4;color:#F7F5F0;font-size:31px;max-width:46ch">Generative AI and agentic AI models are novel and rapidly evolving. As such, they are not within the scope of this guidance.</div>
  <div class="attr" style="color:#8E8A80">SR&nbsp;26&#8209;2, <i>Revised Guidance on Model Risk Management</i>, 17&nbsp;April&nbsp;2026; footnote&nbsp;3 of the attached guidance. Interagency: Federal Reserve, OCC, FDIC. Supersedes SR&nbsp;11&#8209;7 and SR&nbsp;21&#8209;8. OCC counterpart Bulletin&nbsp;2026&#8209;13.</div>
  <p class="frag" style="font-size:22px;margin-top:38px;max-width:70ch;color:#B3B0A8">It isn't a pass. The next sentence hands it back to your own risk management and governance practices, and the one after that says the principles here do apply to traditional models and to non-generative, non-agentic AI. The agencies have said a request for information on generative and agentic AI is coming. So whatever you build between now and then is what you'll be describing when it lands.</p>
</div>`},

{act:"IV · The checks", notes:`Bridge slide. Say it and go.

"Here's the thing though. We have been managing indeterministic operators for a very long time. Longer than model risk management has existed as a function. Longer than the Federal Reserve has existed."

Pause.

"Let me show you the earliest example I've found."`,
html:`<div class="slide center">
  <p class="big" style="font-size:52px;max-width:26ch;text-align:center">We've been managing indeterministic operators for a very long time.</p>
  <p class="frag" style="font-size:23px;color:var(--muted);margin-top:36px;max-width:32ch;text-align:center">Longer than model risk management has existed as a function.</p>
</div>`},

/* ==================== V · JACK ==================== */

{act:"V · Jack", notes:`1880s, Uitenhage, South Africa. James Edwin Wide, a signalman, lost both legs in a fall between moving railcars. He bought a chacma baboon at a market, called him Jack, and trained him to work the signal levers.

Then a passenger looked out of a carriage, saw a baboon deciding where her train went, and complained. The railway sent an inspector.

BEAT ON WHAT THE INSPECTOR DID NOT DO. He did not open Jack's head. There was no interpretability method available for a chacma baboon. He stood there, formed an expectation of which lever ought to be thrown, watched what Jack actually threw, and compared.

That is a check. In the PDCA sense, precisely.

SOURCING, and be straight about it if challenged: the chain is Rev. George Howe (1890) and F. W. FitzSimons in the Cape Mercury, 29 May 1923, both cited in Nisbet, Nature 347:704 (1990). FitzSimons rests on an interview with Wide plus twenty-five witness statements held at the Port Elizabeth Museum. "Nine years without an error" is tradition, not record. Say so plainly rather than defending it.`,
html:`<div class="slide wide">
  <div class="cols" style="grid-template-columns:.92fr 1.08fr;align-items:center;gap:48px">
    <div>
      <h3>1880s &middot; Uitenhage, South Africa</h3>
      <h2 style="font-size:37px;margin-bottom:20px;letter-spacing:-.018em">A railway hired a baboon to throw the signal levers.</h2>
      <p style="font-size:20px;max-width:44ch">James Edwin Wide lost both legs in a fall between moving railcars and came back to work as a signalman. He bought a chacma baboon at the Uitenhage market, called him Jack, and trained him to work the levers in the signal box.</p>
      <p class="frag" style="font-size:20px;max-width:44ch;margin-top:16px">A passenger looked out, saw a baboon deciding where their train went, and complained. The railway sent someone to check.</p>
    </div>
    <div><img class="plate" src="${JACK}" alt="Jack the baboon at a signal lever, with Wide in his chair and a railway inspector holding a clipboard"></div>
  </div>
  <div class="fn" style="bottom:22px">Sources: Rev. George Howe (1890) and F. W. FitzSimons, <i>Cape Mercury</i>, 29 May 1923, both cited in Nisbet, <i>Nature</i> 347:704 (1990). FitzSimons rests on an interview with Wide plus twenty-five witness statements held at the Port Elizabeth Museum. &ldquo;Nine years without an error&rdquo; is tradition, not record, and the inspection scene that follows is a reconstruction.</div>
</div>`},

{act:"V · Jack", notes:`Deliver this flat. It is the thesis of the second half.

"Managing baboon risk in the 1880s looks a lot like managing agent risk today. And I mean that structurally, not as a joke."

Why: you can't open it. You can't ask it to explain itself in terms you can act on. Its behaviour depends on an environment you don't fully control. And it is fast enough and useful enough that taking it out isn't really on the table.

So the only thing left is to watch what it does and decide whether you would have done the same. That is not a compromise. That is what oversight has always been.`,
html:`<div class="slide center">
  <p class="big" style="font-size:50px;max-width:none;text-align:center">Managing baboon risk in the 1880s<br>looks a lot like managing<br>agent risk today.</p>
  <p class="frag" style="font-size:22px;color:var(--muted);margin-top:36px;max-width:44ch;text-align:center">You can't open it, and you can't ask it why in terms you can act on. So somebody watches what it does, decides whether they'd have done the same, and can stop it if they wouldn't.</p>
</div>`},

{act:"V · Jack", notes:`Now map the three lines onto the picture. This is the payoff slide for the whole Jack thread.

FIRST LINE. Wide watches Jack, every train, and can stop him. That is a control, and it sits with the operator.

SECOND LINE. The inspector checks independently. He did not train Jack, he does not work for Wide, and he brings his own expectation. Point at the clipboard.

THIRD LINE. The records. And here is the detail I like: the reason we are able to talk about Jack at all, a hundred and forty years later, is that somebody wrote it down. Witness statements, a museum file, a note in Nature. The audit trail outlived every participant.

Then close the act: "Three lines of defense in the 1880s. Nobody had written the position paper yet."

DO NOT SAY A SPECIFIC YEAR for the inspection. Jack was bought around 1881 and died in 1890; nothing is documented for 1885.

AND BE STRAIGHT ABOUT THE THIRD LINE, because it is the weakest card on the slide. The surviving record is Howe in 1890 and FitzSimons in 1923, and the witness statements were collected in the 1920s by the director of the museum that holds them. That is retrospective, single-custodian evidence, which is the opposite of what a third line is for. Say that out loud. It costs you nothing and it is the most credible thing you will say in this act.`,
html:`<div class="slide wide">
  <h3 style="margin-bottom:28px">The same three checks, in the 1880s</h3>
  <div class="cols" style="grid-template-columns:1.08fr .92fr;align-items:center;gap:48px">
    <div><img class="plate" src="${JACK}" alt="Jack at the lever, Wide, and the inspector with a clipboard"></div>
    <div class="legend lines">
      <div class="k" style="color:var(--agent)">1ST LINE</div>
      <div class="v"><strong>Control.</strong> Wide watches Jack work, every train, and he can stop him.</div>
      <div class="k" style="color:var(--human)">2ND LINE</div>
      <div class="v"><strong>Validate.</strong> Somebody who didn't train Jack forms their own view of what the levers should do, and tests him against it.</div>
      <div class="k" style="color:var(--third)">3RD LINE</div>
      <div class="v"><strong>Audit.</strong> Written records, which is the only reason we can argue about Jack a hundred and forty years later. Though they were collected decades after the fact, which is exactly the weakness a third line is supposed to remove.</div>
    </div>
  </div>
</div>`},

/* ==================== VI · IN DOMINO ==================== */

{act:"VI · In Domino", notes:`Transition into the product section without changing register. Same argument, now with somewhere to put it.

"So the pattern is old and the three checks are old. What's new is that the loop runs fast enough that none of the three can be a meeting any more. All three have to live in the platform where the work happens."

DO NOT SELL HERE. You have just spent eight minutes earning credibility with Jack and the regulators. This is the slide where a room like this decides whether you are a researcher or a vendor. Same voice, same pace, no adjectives.

The three sentences, said flat:
FIRST LINE. "The guardrail has to be a thing that runs, not a thing that is written down. Which tools this agent can call, which data it can see, which model it can use, and what happens when it asks for something outside that."
SECOND LINE. "The independent test has to form its own expectation from the spec, not from the output, and it has to run on a schedule rather than when somebody remembers."
THIRD LINE. "And the record has to fall out of the loop by itself, because nobody is going to reconstruct a machine-speed loop by hand afterwards."

Then: "We built all three of those. Let me show you, and then you can tell me where it is wrong."`,
html:`<div class="slide">
  <h2 style="margin-bottom:12px">All three checks have to run where the work runs.</h2>
  <p style="font-size:21px;margin-bottom:38px;max-width:78ch">There is no gate left to put them at, so they can't be meetings and they can't be documents. They have to run inside the loop, at the speed the loop runs.</p>
  <div class="cols3">
    <div class="line-card l1">
      <div class="ord">FIRST LINE</div>
      <div class="name" style="font-size:22px">Guardrails</div>
      <div class="paren">Which tools, which data, which model, and what an agent can touch. Enforced at execution rather than written in a document.</div>
    </div>
    <div class="line-card l2">
      <div class="ord">SECOND LINE</div>
      <div class="name" style="font-size:22px">Independent tests</div>

    </div>
    <div class="line-card l3">
      <div class="ord">THIRD LINE</div>
      <div class="name" style="font-size:22px">The record</div>

</div>`},

{act:"VI · In Domino", notes:`SAY THIS BEFORE THE DEMOS. If you skip it, somebody will raise it in Q&A and it will look like you had not thought about it.

"I'm about to show you agents doing the checking. Ten minutes ago I told you that if the agent runs the check, nobody is accountable. So let me be precise about the distinction, because it matters."

An agent can do the labour of a check. Run the test, diff the output against the expectation, assemble the evidence, flag the exception. That work is mechanical and it scales, and doing it by hand is the reason coverage is thin everywhere.

An agent cannot hold the accountability for a check. It cannot be the entity that answers for the acceptance.

So: use agents to widen coverage and to produce the evidence. Keep a named human on the acceptance, and record that acceptance before the fact rather than after. That is the whole design rule.

Line that lands: "The agent does the work of the check. A person still signs it."

AND ANSWER THE BOTTLENECK, because for the line of business people in the room it is the only question they came with. "Nobody can assemble evidence at machine speed. But a person can sign what an agent assembled, and the signature is the part the loop needs from them. That is how you keep a human at Check without making the human the constraint."

CHECKPOINT: you should be here around minute 21. If you are past it, play one demo and describe the other two.`,
html:`<div class="slide">
  <h3 style="margin-bottom:32px">What an agent can and can't own</h3>
  <div class="cols" style="gap:56px;align-items:stretch">

      <div class="ord">AN AGENT CAN</div>
      <div class="paren" style="font-size:20px">Do the labour of a check. Run the test, diff the output against the expectation, assemble the evidence, flag the exception. That work is mechanical, and doing it by hand is why coverage is thin everywhere.</div>
    </div>
    <div class="line-card frag" style="border-top-color:var(--accent)">
      <div class="ord" style="color:var(--accent)">AN AGENT CAN'T</div>

    </div>

  <p class="frag" style="font-size:22px;margin-top:34px;max-width:64ch">Which is also the answer to the throughput problem. Nobody can assemble evidence at machine speed, but a person can sign what an agent assembled, and that signature is the part the loop actually needs from them.</p>
</div>`},

THE TWO QUESTIONS YOU WILL ACTUALLY GET, prepare both:

"You are a vendor. Why should the control live in your platform?" Answer: it does not have to. The argument is that all three checks have to run where the work runs, and that is true whoever builds it. What a platform buys you is that the record is a byproduct rather than a project. If you already have that, you do not need us for it.

/* ============================================================
   ENGINE
   ============================================================ */
const stage=document.getElementById('stage'), bar=document.getElementById('bar'),
      numEl=document.getElementById('num'), actEl=document.getElementById('act'),
      clockEl=document.getElementById('clock'), notesEl=document.getElementById('notes'),
      notesBody=notesEl.querySelector('.body'), ovl=document.getElementById('ovl'),
      ovg=document.getElementById('ovg');

let i=0, f=0, notesOn=false, clockOn=false, t0=null, elapsed=0, running=false;
const BUDGET=30*60;

SLIDES.forEach((s,k)=>{
  const d=document.createElement('div');
  d.innerHTML=s.html.trim();
  const el=d.firstElementChild;
  if(!el){ console.warn('slide '+(k+1)+' has no root element'); return; }
  if(d.children.length>1) console.warn('slide '+(k+1)+' has '+d.children.length+' roots; only the first is used');
  el.dataset.k=k;
  stage.appendChild(el);
});
const slides=[...stage.children];

function frags(){return [...slides[i].querySelectorAll('.frag')];}

/* demo video slots: show the video only if the file is actually there */
/* Demo video slots.
   Over http, Chrome does not honour preload="metadata" on a large file: it
   fetches the whole thing as soon as the src attribute exists. So when hosted
   we hold the src back entirely, ask the server whether the file is there with
   a HEAD request, and only attach the src for the slide you are on and the one
   after it. Locally (file://) bandwidth is free, so probe the normal way. */
const HOSTED = location.protocol === 'http:' || location.protocol === 'https:';

slides.forEach(s=>{
  const v=s.querySelector('video'); if(!v) return;
  const ph=s.querySelector('.ph');
  const url=v.getAttribute('src');
  const ok=()=>{v.style.display='block'; if(ph)ph.style.display='none';};
  const bad=()=>{v.style.display='none'; if(ph)ph.style.display='flex';};
  bad();
  v.dataset.url=url;
  ['loadedmetadata','loadeddata','canplay'].forEach(ev=>v.addEventListener(ev,ok));
  v.addEventListener('error',bad);

  const slideEl=s;
  v.addEventListener('play', ()=>slideEl.classList.add('playing'));
  ['pause','ended'].forEach(ev=>v.addEventListener(ev, ()=>slideEl.classList.remove('playing')));

  const localProbe=()=>{
    v.preload='metadata';
    if(!v.getAttribute('src')) v.setAttribute('src',url);
    if(v.readyState>=1) ok();
    else setTimeout(()=>{ if(v.readyState<1) bad(); },4000);
  };

  if(HOSTED){
    v.removeAttribute('src');          /* nothing is fetched until we ask */
    v.preload='auto';
    fetch(url,{method:'HEAD'})
      .then(r=>{ if(r.ok){ v.dataset.exists='1'; ok(); } else bad(); })
      .catch(()=>localProbe());        /* HEAD blocked: fall back rather than lie */
  } else {
    localProbe();
  }
});

/* attach and buffer only the slide you are on and the next one */
function primeVideos(){
  slides.forEach((sl,k)=>{
    const v=sl.querySelector('video');
    if(!v || v.dataset.primed) return;
    if(Math.abs(k-i)>1) return;
    if(HOSTED && !v.dataset.exists) return;
    v.dataset.primed='1';
    if(!v.getAttribute('src')) v.setAttribute('src', v.dataset.url);
    v.preload='auto';
    try{ v.load(); }catch(_){}
  });
}

function fit(){
  const nh = notesOn ? Math.round(window.innerHeight*0.36) : 0;
  const availH = Math.max(120, window.innerHeight - nh - 22);
  const availW = Math.max(160, window.innerWidth - 22);
  const s = Math.min(availW/1280, availH/720);
  stage.style.transformOrigin = 'top center';
  stage.style.transform = `scale(${s})`;
  stage.style.marginBottom = '0';
  document.body.style.alignItems = 'flex-start';
  document.body.style.paddingTop = ((availH - 720*s)/2 + 11) + 'px';
}

function shrinkToFit(el){
  if(el.classList.contains('demo')) return;   /* absolutely positioned, nothing to scale */
  let wrap=el.querySelector(':scope > .fitwrap');
  if(!wrap){
    wrap=document.createElement('div');
    wrap.className='fitwrap';
    const keep=[];                            /* footnotes are pinned to the slide, not the block */
    while(el.firstChild){
      const c=el.firstChild;
      if(c.nodeType===1 && c.classList.contains('fn')) keep.push(el.removeChild(c));
      else wrap.appendChild(c);
    }
    el.appendChild(wrap);
    keep.forEach(k=>el.appendChild(k));
  }
  wrap.style.transform='none';
  const cs=getComputedStyle(el);
  const avail=720-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const h=wrap.scrollHeight;
  if(h>avail+1) wrap.style.transform=`scale(${Math.max(0.62, avail/h)})`;
}

function render(){
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  const el=slides[i], meta=SLIDES[i];
  frags().forEach((x,k)=>x.classList.toggle('show',k<f));
  shrinkToFit(el);
  bar.style.width=((i+1)/slides.length*100)+'%';
  numEl.textContent=String(i+1).padStart(2,'0')+' / '+slides.length;
  actEl.textContent=meta.act||'';
  const dark=el.classList.contains('dark')||el.classList.contains('demo');
  numEl.style.color=actEl.style.color=dark?'#7E7A73':'#8E8A80';
  notesBody.innerHTML=(meta.notes||'').trim() || '<i style="color:#6A6760">No notes.</i>';
  notesEl.scrollTop=0;
  [...ovg.children].forEach((c,k)=>c.classList.toggle('cur',k===i));
  const v=el.querySelector('video');
  slides.forEach(s=>{const vv=s.querySelector('video'); if(vv&&vv!==v){vv.pause();}});
  primeVideos();
  try{ history.replaceState(null,'','#'+(i+1)); }catch(_){}
}

function go(n){ n=Math.max(0,Math.min(slides.length-1,n)); i=n; f=0; render(); }
function next(){ const n=frags().length; if(f<n){f++;render();} else if(i<slides.length-1){i++;f=0;render();} }
function prev(){ if(f>0){f--;render();} else if(i>0){i--; f=frags().length; render();} }

function tick(){
  if(running && t0!==null) elapsed = Math.floor((Date.now()-t0)/1000);
  const m=Math.floor(elapsed/60), s=elapsed%60;
  clockEl.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} / 30:00`;
  clockEl.classList.toggle('over', elapsed>=BUDGET);
}
setInterval(tick,500); tick();

function startClock(){ if(!running){ t0=Date.now()-elapsed*1000; running=true; } }

/* the key hint is for the first ten seconds, not for the audience */
const helpEl=document.getElementById('help');
setTimeout(()=>helpEl.classList.add('gone'),9000);
document.addEventListener('keydown',()=>helpEl.classList.add('gone'),{once:true});
document.addEventListener('mousemove',()=>{
  if(document.fullscreenElement) return;   /* don't flash the cheat sheet at the room */
  helpEl.classList.remove('gone');
  clearTimeout(helpEl._t); helpEl._t=setTimeout(()=>helpEl.classList.add('gone'),2600);
});

let scaleMinis=()=>{};
function buildOverview(){
  slides.forEach((s,k)=>{
    const card=document.createElement('div'); card.className='ocard';
    const mini=document.createElement('div'); mini.className='mini';
    /* build from markup with the <video> tags stripped out. cloneNode would
       copy the src attribute and Chrome starts fetching a detached media
       element, which over http means every demo downloads on page load. */
    const holder=document.createElement('div');
    holder.innerHTML=s.outerHTML.replace(/<video\b[\s\S]*?<\/video>/gi,'');
    const clone=holder.firstElementChild;
    clone.classList.add('active');
    clone.querySelectorAll('.frag').forEach(x=>x.classList.add('show'));
    mini.appendChild(clone);
    card.appendChild(mini);
    const tag=document.createElement('div'); tag.className='on';
    tag.textContent=String(k+1).padStart(2,'0')+(SLIDES[k].act?' · '+SLIDES[k].act:'');
    card.appendChild(tag);
    card.onclick=()=>{ go(k); ovl.classList.remove('on'); };
    ovg.appendChild(card);
  });
  scaleMinis=()=>{
    const c=ovg.children[0]; if(!c) return;
    const w=c.clientWidth; if(!w) return;      /* still hidden: nothing to measure yet */
    [...ovg.querySelectorAll('.mini')].forEach(m=>m.style.transform=`scale(${w/1280})`);
  };
  window.addEventListener('resize',scaleMinis);
}

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;    /* never eat a browser shortcut */
  if(e.repeat) return;                          /* a held key must not stampede the deck */
  if(ovl.classList.contains('on')){
    if(e.key==='Escape'||e.key==='o'||e.key==='O'){ovl.classList.remove('on');e.preventDefault();}
    return;
  }
  /* a focused video keeps space and the arrows for its own controls */
  if(e.target.tagName==='VIDEO' && [' ','ArrowLeft','ArrowRight'].includes(e.key)) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown':
      startClock(); next(); e.preventDefault(); break;
    case 'ArrowLeft': case 'PageUp':
      prev(); e.preventDefault(); break;
    case 'ArrowDown': case 'ArrowUp':
      if(notesOn){ notesEl.scrollTop += (e.key==='ArrowDown'?120:-120); e.preventDefault(); break; }
      startClock(); (e.key==='ArrowDown'?next():prev()); e.preventDefault(); break;
    case 'Home': go(0); e.preventDefault(); break;
    case 'End': go(slides.length-1); e.preventDefault(); break;
    case 's': case 'S':
      notesOn=!notesOn; notesEl.classList.toggle('on',notesOn); fit(); e.preventDefault(); break;
    case 'f': case 'F':
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else document.documentElement.requestFullscreen().catch(()=>{});
      e.preventDefault(); break;
    case 't': case 'T':
      clockOn=!clockOn; clockEl.classList.toggle('on',clockOn); if(clockOn)startClock(); e.preventDefault(); break;
    case '0':
      elapsed=0; t0=Date.now(); tick(); e.preventDefault(); break;
    case 'o': case 'O':
      ovl.classList.add('on'); scaleMinis();
      [...ovg.children].forEach((c,k)=>c.classList.toggle('cur',k===i)); e.preventDefault(); break;
    case 'p': case 'P':
      window.print(); e.preventDefault(); break;
  }
});

stage.addEventListener('click',e=>{
  if(e.target.closest('video')) return;
  startClock();
  const r=stage.getBoundingClientRect();       /* post-transform, correct at any zoom */
  ((e.clientX - r.left) / r.width < 0.28) ? prev() : next();
});

window.addEventListener('resize',fit);
buildOverview(); fit(); render();

/* deep link: #12 opens slide 12 */
if(location.hash){ const n=parseInt(location.hash.slice(1),10); if(!isNaN(n)) go(n-1); }
window.addEventListener('hashchange',()=>{
  const n=parseInt(location.hash.slice(1),10);
  if(!isNaN(n) && n-1!==i) go(n-1);
});
</script>
</body>
</html>
